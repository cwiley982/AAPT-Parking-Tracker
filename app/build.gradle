plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id("org.jetbrains.kotlin.plugin.serialization") version "2.0.0"
    id("org.jetbrains.kotlin.plugin.compose") version "2.0.0"
}

android {
    namespace 'com.caitlynwiley.aapparkingsaver'
    compileSdk 34

    defaultConfig {
        applicationId "com.caitlynwiley.aapparkingsaver"
        minSdk 27
        targetSdk 34
        versionCode 3
        versionName "1.2" // 1.[versionCode - 1 b/c zero-indexed]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.9.0"
    implementation "androidx.compose.ui:ui:$compose_vsn"
    implementation "androidx.compose.material3:material3:1.1.0-alpha01"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_vsn"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_vsn"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycle_vsn"
    implementation "androidx.activity:activity-compose:1.6.1"

    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.1"

    implementation(platform("com.google.firebase:firebase-bom:33.1.2"))
    implementation("com.google.firebase:firebase-database")
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    testImplementation "junit:junit:4.13.2"

    androidTestImplementation "androidx.test.ext:junit:1.1.3"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.4.0"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_vsn"

    debugImplementation "androidx.compose.ui:ui-tooling:$compose_vsn"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_vsn"
}